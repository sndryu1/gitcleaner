name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }
  exe:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --name gitcleaner gitcleaner.py
      - name: Rename
        shell: bash
        run: |
          cd dist
          for f in gitcleaner gitcleaner.exe; do
            [ -f "$f" ] && mv "$f" "gitcleaner-${{ runner.os }}${f#gitcleaner}"
          done
          ls
      - uses: actions/upload-artifact@v4
        with: { name: exe-${{ matrix.os }}, path: dist/* }
  release:
    needs: [dist, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
