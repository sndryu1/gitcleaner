[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcleaner"
version = "0.1.1"
description = "Find merged, stale and orphaned git branches and delete them safely"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "sndryu1" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sndryu1/gitcleaner"

[project.scripts]
gitcleaner = "gitcleaner:main"

[tool.setuptools]
py-modules = ["gitcleaner"]
